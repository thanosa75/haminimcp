[project]
name = "homeassistant_mcp"
version = "0.1.0"
requires-python = ">=3.11"
description = "MCP server for Home Assistant light and calendar control"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.9.0"
    # logging is part of the standard library; no extra dependency needed
]

[project.scripts]
homeassistant_mcp = "homeassistant_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
